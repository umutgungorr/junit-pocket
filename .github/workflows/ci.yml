name: junit-pocket-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test tools
        run: python -m pip install pytest==9.1.1 ruff==0.16.8
      - name: Check source and shipped tests
        run: python -m ruff check src tests contract_tests
      - name: Run behavior, regression and contract tests
        run: python -m pytest -q -p no:cacheprovider
      - name: Smoke test sample report
        run: python -m junit_pocket --junit examples/sample.xml

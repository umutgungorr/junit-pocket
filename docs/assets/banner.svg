<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">JUnit Pocket</title>
  <desc id="desc">JUnit XML in, focused JSON out. A local Python command line tool.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10192d"/><stop offset="1" stop-color="#17243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5eead4"/><stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1110" cy="20" r="210" fill="#60a5fa" opacity=".05"/>
  <circle cx="1000" cy="340" r="190" fill="#5eead4" opacity=".04"/>
  <rect x="64" y="55" width="152" height="28" rx="14" fill="#183a40"/>
  <text x="140" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#99f6e4">LOCAL PYTHON CLI</text>
  <text x="60" y="155" font-family="Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#f8fafc">JUnit Pocket</text>
  <text x="64" y="199" font-family="Arial, sans-serif" font-size="22" fill="#cbd5e1">JUnit XML in. Focused JSON out.</text>
  <rect x="64" y="236" width="435" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="64" y="277" font-family="Arial, sans-serif" font-size="16" fill="#94a3b8">Real counts · Bounded identifiers · Offline</text>
  <rect x="666" y="82" width="172" height="190" rx="16" fill="#0c1425" stroke="#334155"/>
  <text x="690" y="119" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" fill="#94a3b8">INPUT</text>
  <text x="690" y="173" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#93c5fd">&lt;xml&gt;</text>
  <text x="690" y="210" font-family="Arial, sans-serif" font-size="17" fill="#e2e8f0">JUnit report</text>
  <path d="M858 177 H904 M894 167 L904 177 L894 187" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="924" y="82" width="212" height="190" rx="16" fill="#0c1425" stroke="#335d60"/>
  <text x="948" y="119" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" fill="#94a3b8">OUTPUT</text>
  <text x="948" y="173" font-family="Consolas, monospace" font-size="28" font-weight="700" fill="#5eead4">{ JSON }</text>
  <text x="948" y="210" font-family="Arial, sans-serif" font-size="17" fill="#e2e8f0">Counts + failures</text>
</svg>
